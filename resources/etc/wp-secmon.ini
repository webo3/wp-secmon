; wp-secmon configuration
;
; Everything here is optional: the values shown commented out are the defaults.
; Lists use "key[] = value", one line per item. Setting a list replaces its
; default entirely. Values containing special characters (* ; = etc.) must be
; quoted. Section names are only for readability.

[general]
; Language of the reports, e-mails and command output: en (English) or fr
; (French). "--lang" overrides it for one command. After a change, open
; problems are reported once more, in the new language.
;language = en

[wp-cli]
; WP-CLI binary. It is run as each site owner, so it must be owned by root and
; not writable by anyone else. "wp-secmon install" downloads it here when nothing
; is there.
;wp_cli = /usr/local/bin/wp

; PHP binary used to run WP-CLI. Empty = the phar's own shebang (the first
; "php" in user_path). On cPanel, /usr/local/bin/php follows the server default.
;wp_php =
;wp_php_args[] = "-d memory_limit=512M"

; Seconds before a single WP-CLI call is killed.
;wp_timeout = 300

; Megabytes a single WP-CLI call may write to stdout and to stderr. More fails
; the check for that site. Raise it for sites with more than ~200,000 accounts.
;max_output_mb = 32

; PATH given to site owner processes.
;user_path = /usr/local/bin:/usr/bin:/bin

; How to switch to site owners: auto, setpriv, runuser, sudo, su or cagefs.
; auto prefers setpriv (no PAM session, no_new_privs), then runuser, sudo, su.
; "cagefs" runs inside CloudLinux CageFS with cagefs_enter_user; wp-cli and
; the PHP binary running wp-secmon must then be available inside the cage.
;run_as_method = auto

[discovery]
; Directories searched for WordPress installs (a directory with wp-load.php,
; wp-settings.php and wp-includes/version.php, and wp-config.php in it or in
; its parent). Symbolic links are never followed.
;scan_paths[] = /home
;scan_paths[] = /var/www
;scan_paths[] = /srv/www

; Directory levels searched below each scan path.
;scan_max_depth = 6

; Directories not searched (shell globs, "*" also matches "/").
;scan_exclude[] = /home/virtfs
;scan_exclude[] = /home/cagefs-skeleton
;scan_exclude[] = /home/cpeasyapache
;scan_exclude[] = "*/.cagefs"
;scan_exclude[] = "*/.trash"
;scan_exclude[] = "*/mail"
;scan_exclude[] = "*/.cpanel"
;scan_exclude[] = "*/.cache"
;scan_exclude[] = "*/.git"
;scan_exclude[] = "*/node_modules"
;scan_exclude[] = "*/.wp-cli"

; WordPress roots outside the scan paths.
;extra_sites[] = /opt/sites/example.com/public

; WordPress roots never checked (shell globs).
;exclude_sites[] = "/home/*/public_html/old-backup*"

; Discovery runs daily; checks re-run it first when the list is older than this.
;discovery_max_age_hours = 26

[accounts]
; Each site is checked as the owner of its WordPress directory, never as root.
; Map sites to another account (or "-" to skip them) in this file:
;site_users_map = /etc/wp-secmon/site-users.map

; Directory owners below this uid are not used automatically, except the
; accounts listed in allowed_system_users. Old cPanel servers may need 500.
;min_uid = 1000
;allowed_system_users[] = www-data
;allowed_system_users[] = nginx
;allowed_system_users[] = apache

; Account used for sites whose files belong to root (typical on LEMP setups
; where root owns the code and PHP-FPM runs as www-data). Empty = skip them.
;fallback_user =

; Sites are never checked as members of these groups, which are as good as
; root. Accounts whose primary group is root, or in the root group, are always
; refused. Setting this list replaces it entirely.
;forbidden_groups[] = wheel
;forbidden_groups[] = sudo
;forbidden_groups[] = admin
;forbidden_groups[] = docker
;forbidden_groups[] = lxd
;forbidden_groups[] = incus-admin
;forbidden_groups[] = libvirt
;forbidden_groups[] = disk
;forbidden_groups[] = shadow

; Do not check suspended cPanel accounts.
;skip_suspended_cpanel = yes

[storage]
;state_dir = /var/lib/wp-secmon
;log_dir = /var/log/wp-secmon

[alerts]
; Where reports go. On cPanel, root's mail follows the "contact e-mail" setting.
;alert_email = root
;alert_from =
;sendmail = /usr/sbin/sendmail

; A report is e-mailed only when it contains at least one alert of this
; severity: info, warning or critical.
;mail_min_severity = warning

; html: a summary per site with what to do, in HTML with a plain-text version.
; text: every detail (file lists, CVEs...) in plain text. Either way, the full
; details are kept in log_dir/last-report-*.txt.
;mail_format = html

; Also run this command for each e-mailed report (/bin/sh -c, as root). The
; text summary is on stdin; $WPG_SUBJECT and $WPG_SEVERITY are set. It quotes
; text controlled by the sites (account names, paths, plugin names): pass it
; along as data, never evaluate it. Example (ntfy.sh push):
;alert_command = "curl -fsS -H \"Title: $WPG_SUBJECT\" --data-binary @- https://ntfy.sh/my-private-topic"

; Ongoing problems (modified core files, vulnerabilities...) are repeated every
; N hours while unchanged. 0 = only when they appear or change.
;alert_repeat_hours = 24

;alert_on_resolve = yes
;alert_on_errors = yes
;alert_on_skipped_sites = yes
;alert_on_new_sites = yes

[users]
; Roles treated as privileged (network super admins always are).
;privileged_roles[] = administrator
;privileged_roles[] = editor
;privileged_roles[] = shop_manager

; New accounts are always reported when privileged. With "all", new
; unprivileged accounts are reported too, with users_new_severity (set it to
; info on shops and membership sites where customers sign up all day).
;users_alert_new = all
;users_new_severity = warning

[integrity]
; Open registration with one of these default roles is reported as critical.
;risky_default_roles[] = administrator
;risky_default_roles[] = editor
;risky_default_roles[] = author
;risky_default_roles[] = shop_manager

; Executable files allowed in uploads (globs relative to the uploads directory).
; "Silence is golden" stubs and compiled Twig templates (WPML cache) are
; recognised by their content and never reported. Keep globs narrow: web
; shells are often dropped in cache folders.
;uploads_exec_allow[] = "wpforms/cache/index.php"

[checksums]
; Core files to ignore (globs relative to the WordPress root).
;core_checksum_ignore[] = "wp-content/languages/*"

; Also report changes to readme.txt and other "soft" plugin files.
;plugin_checksum_strict = no

; Plugins not verified at all (slugs), and files to ignore ("slug/path" globs).
;plugin_checksum_exclude[] = some-plugin
;plugin_checksum_ignore[] = "some-plugin/cache/*"

[vulns]
; Vulnerability data: https://www.wpvulnerability.net (free, no API key).
;vuln_api_url = https://www.wpvulnerability.net
;wp_version_api_url = https://api.wordpress.org/core/version-check/1.7/
;vuln_cache_hours = 12
; Known vulnerabilities are repeated weekly while unfixed.
;vuln_repeat_hours = 168
;vuln_request_delay_ms = 200
; Inactive plugins and themes can still be exploited through direct requests.
;vuln_include_inactive = yes

; Proxy for outgoing HTTPS: vulnerability data, WordPress releases, WP-CLI
; download and wp-secmon updates.
;http_proxy =

[update]
; Where "wp-secmon update" finds the latest release (GitHub API format).
;update_url = https://api.github.com/repos/webo3/wp-secmon/releases/latest
